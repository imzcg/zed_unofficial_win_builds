name: Nightly
on: push

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable long paths in Git
        run: |
          git config --system core.longpaths true

      - name: Checkout self
        uses: actions/checkout@v4

      - name: Checkout Zed
        uses: actions/checkout@v4
        with:
          repository: zed-industries/zed
          ref: main
          path: zed

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
            toolchain: nightly
            override: true
            target: "wasm32-wasip1"

      - name: Show Rust toolchain info
        run: |
            rustc --version
            rustup show

      - name: Today
        id: today
        shell: bash
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: apply diff
        run: |
              cd zed
              curl -o temp_diff.patch https://gist.githubusercontent.com/imzcg/6698aa64d5fea9b10bc2065392e04638/raw/bdae50941f9a566ef847a4b640ae62186a7cb7bd/stash_diff.patch
              cat temp_diff.patch
              git apply temp_diff.patch
      - name: Build release
        working-directory: zed
        run: cargo build --release

      - name: Zip release
        run: |
          7z a -tzip zed/target/release/zed.exe.zip zed/target/release/zed.exe

      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: zed-${{ steps.today.outputs.date }}.zip
          path: zed/target/release/zed.exe.zip
